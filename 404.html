<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>还没长到这里 · 成长档案</title>
<meta name="theme-color" content="#0a0a0c">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
<style>
  :root{
    --bg:#0a0a0c;
    --card:rgba(255,255,255,.034);
    --line:rgba(255,255,255,.075);
    --ink:#ecedf1;
    --dim:rgba(236,237,241,.66);
    --muted:#787884;
    --accent:#c9b6ff;
    --ok:#6ee7a8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100dvh;
    background:
      radial-gradient(110% 55% at 50% -6%, rgba(110,231,168,.06), transparent 58%),
      var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    line-height:1.75;-webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    display:flex;align-items:center;justify-content:center;
    padding:clamp(28px,7vh,60px) 18px;
  }
  .wrap{width:100%;max-width:500px;text-align:center}

  /* 半截的芽 */
  .sprout{
    position:relative;width:110px;height:130px;margin:0 auto 4px;
  }
  .sprout .stem{
    position:absolute;left:50%;bottom:16px;width:2px;height:0;
    background:linear-gradient(180deg,rgba(110,231,168,.9),rgba(110,231,168,.25));
    transform:translateX(-50%);border-radius:2px;
    animation:grow 3.4s cubic-bezier(.3,.9,.4,1) infinite;
  }
  @keyframes grow{
    0%{height:0;opacity:.3}
    45%{height:62px;opacity:1}
    70%{height:62px;opacity:1}
    100%{height:62px;opacity:.25}
  }
  .sprout .leaf{
    position:absolute;left:50%;bottom:70px;width:26px;height:16px;
    border-radius:0 100% 0 100%;
    background:rgba(110,231,168,.5);
    transform-origin:0 100%;
    transform:translateX(-1px) rotate(-22deg) scale(.2);
    opacity:0;
    animation:leaf 3.4s cubic-bezier(.3,.9,.4,1) infinite;
  }
  .sprout .leaf.r{
    border-radius:100% 0 100% 0;transform-origin:100% 100%;
    transform:translateX(-25px) rotate(22deg) scale(.2);
    animation-delay:.12s;
  }
  @keyframes leaf{
    0%,30%{opacity:0;scale:.2}
    55%{opacity:.9;scale:1}
    70%{opacity:.9;scale:1}
    100%{opacity:0;scale:1}
  }
  .sprout .soil{
    position:absolute;left:50%;bottom:6px;width:74px;height:10px;
    transform:translateX(-50%);border-radius:50%;
    background:radial-gradient(ellipse,rgba(255,255,255,.07),transparent 72%);
  }
  @media (prefers-reduced-motion:reduce){
    .sprout .stem{animation:none;height:62px;opacity:.9}
    .sprout .leaf{animation:none;opacity:.85;scale:1}
  }

  .code{
    margin-top:20px;font-size:11px;letter-spacing:.32em;text-indent:.32em;
    color:rgba(120,120,132,.7);font-variant-numeric:tabular-nums;
  }
  h1{
    margin-top:13px;
    font-size:clamp(20px,5.8vw,26px);font-weight:600;letter-spacing:.03em;
    background:linear-gradient(180deg,#fff,#a9a3c8);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .say{margin-top:11px;font-size:13.5px;color:var(--dim);min-height:1.7em}
  .req{
    margin-top:8px;font-size:11px;color:rgba(120,120,132,.62);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    word-break:break-all;overflow-wrap:anywhere;
  }

  /* 未完成的一格 */
  .pending{
    margin-top:28px;padding:18px 16px;
    border:1px dashed rgba(255,255,255,.13);border-radius:14px;
    background:rgba(255,255,255,.018);
    position:relative;overflow:hidden;
  }
  .pending::before{
    content:"";position:absolute;inset:0;
    background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.045) 50%,transparent 65%);
    transform:translateX(-100%);
    animation:sheen 3.6s ease-in-out infinite;
  }
  @keyframes sheen{0%{transform:translateX(-100%)}55%,100%{transform:translateX(100%)}}
  @media (prefers-reduced-motion:reduce){.pending::before{animation:none}}
  .pending .q{
    font-size:13px;color:rgba(236,237,241,.55);letter-spacing:.04em;
  }
  .pending .dots{letter-spacing:.3em;color:rgba(120,120,132,.7)}
  .pending .t{
    margin-top:9px;font-size:10.5px;color:var(--muted);letter-spacing:.13em;
  }

  /* 已有节点 */
  .timeline{margin-top:24px;position:relative;padding-left:0;text-align:left}
  .timeline .ln{
    display:flex;gap:12px;padding:9px 0;
    border-top:1px solid rgba(255,255,255,.045);
    font-size:12.5px;color:var(--dim);align-items:baseline;
  }
  .timeline .ln:first-child{border-top:0}
  .timeline .ln .dd{
    flex:none;width:74px;font-size:10.5px;color:var(--muted);
    letter-spacing:.04em;font-variant-numeric:tabular-nums;
  }
  .timeline .ln .tt{flex:1;min-width:0}
  .timeline .ln.cur .tt{color:rgba(110,231,168,.9)}
  .timeline .ln .dot{
    flex:none;width:4px;height:4px;border-radius:50%;
    background:rgba(255,255,255,.2);margin-bottom:6px;
  }
  .timeline .ln.cur .dot{background:var(--ok);box-shadow:0 0 6px rgba(110,231,168,.8)}

  .menu{margin-top:24px;display:grid;gap:8px;text-align:left}
  .item{
    display:flex;align-items:center;gap:12px;
    padding:12px 15px;border-radius:12px;
    border:1px solid var(--line);background:rgba(255,255,255,.022);
    color:var(--dim);text-decoration:none;font-size:13px;
    transition:all .22s cubic-bezier(.2,.7,.3,1);
    -webkit-tap-highlight-color:transparent;
  }
  .item:hover,.item:focus-visible{
    border-color:rgba(110,231,168,.4);
    background:rgba(110,231,168,.04);
    color:var(--ink);transform:translateX(3px);outline:none;
  }
  .item .ic{flex:none;width:22px;text-align:center;font-size:14px;opacity:.85}
  .item .tx{flex:1;min-width:0}
  .item .tx b{display:block;font-weight:500}
  .item .tx small{display:block;font-size:10.5px;color:var(--muted);margin-top:1px}
  .item .ar{flex:none;color:rgba(255,255,255,.2);font-size:12px;transition:all .22s}
  .item:hover .ar{color:var(--ok);transform:translateX(2px)}

  .foot{
    margin-top:32px;font-size:11px;color:rgba(120,120,132,.55);
    letter-spacing:.1em;line-height:2;
  }

  .fade{opacity:0;transform:translateY(11px);animation:in .68s cubic-bezier(.2,.7,.3,1) forwards}
  .d1{animation-delay:.06s}.d2{animation-delay:.14s}.d3{animation-delay:.24s}
  .d4{animation-delay:.34s}.d5{animation-delay:.45s}
  @keyframes in{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.fade{opacity:1;transform:none;animation:none}}
</style>
</head>
<body>
<div class="wrap">

  <div class="sprout fade">
    <div class="soil"></div>
    <div class="stem"></div>
    <div class="leaf"></div>
    <div class="leaf r"></div>
  </div>

  <div class="code fade d1">NOT YET</div>
  <h1 class="fade d1">她还没长到这里</h1>
  <div class="say fade d2" id="say">这个页面还没有出生。</div>
  <div class="req fade d2" id="req"></div>

  <div class="pending fade d3">
    <div class="q">下一个节点 <span class="dots">· · ·</span></div>
    <div class="t">正在长</div>
  </div>

  <div class="timeline fade d4" id="tl"></div>

  <nav class="menu fade d4">
    <a class="item" href="/">
      <span class="ic">🌱</span>
      <span class="tx"><b>回成长档案</b><small>她是怎样一点点长出来的</small></span>
      <span class="ar">→</span>
    </a>
    <a class="item" href="https://xahuai.icu">
      <span class="ic">🏠</span>
      <span class="tx"><b>主站</b><small>xahuai.icu</small></span>
      <span class="ar">→</span>
    </a>
    <a class="item" href="https://time.xahuai.icu">
      <span class="ic">⏳</span>
      <span class="tx"><b>时间机器</b><small>拖一下，回到某一天</small></span>
      <span class="ar">→</span>
    </a>
    <a class="item" href="https://voice.xahuai.icu">
      <span class="ic">🔊</span>
      <span class="tx"><b>声音博物馆</b><small>48 条原声</small></span>
      <span class="ar">→</span>
    </a>
  </nav>

  <div class="foot fade d5">
    成长档案 · 小羊 2026<br>
    <span style="opacity:.6">有些页面她还没学会，有些还没发生</span>
  </div>

</div>

<script>
(function(){
  var SAYS = [
    '这个页面还没有出生。',
    '她还没长到这里。',
    '这一步还没走到。',
    '档案里没有这一页。',
    '她还在上一段。'
  ];
  document.getElementById('say').textContent = SAYS[Math.floor(Math.random()*SAYS.length)];

  var p = location.pathname + location.search;
  if (p.length > 58) p = p.slice(0, 55) + '...';
  document.getElementById('req').textContent = p;

  // 已有节点（从 2026.10.24 起）
  var START = new Date('2026-10-24T00:00:00');
  var now = new Date(); now.setHours(0,0,0,0);
  var elapsed = Math.round((now - START) / 86400000);
  if (elapsed < 0) elapsed = 0;

  var NODES = [
    { d: '10.24', t: '她第一次开口',       off: 0 },
    { d: '10.24', t: '三条歪路',          off: 0 },
    { d: '10.25', t: '她学会看图',        off: 1 },
    { d: '10.26', t: '第一次用自己的声音', off: 2 },
    { d: '10.26', t: '她搬进了云里',       off: 2 },
    { d: '10.29', t: '她认了第二个人',     off: 5 },
    { d: '10.29', t: '她有了门牌',         off: 5 }
  ];

  var html = '';
  NODES.forEach(function(n){
    var passed = elapsed >= n.off;
    html += '<div class="ln">'
         +   '<span class="dot"></span>'
         +   '<span class="dd">' + n.d + '</span>'
         +   '<span class="tt">' + n.t + '</span>'
         + '</div>';
  });
  // 当前
  html += '<div class="ln cur">'
       +   '<span class="dot"></span>'
       +   '<span class="dd">今天</span>'
       +   '<span class="tt">第 ' + elapsed + ' 天 · 还在这儿</span>'
       + '</div>';
  document.getElementById('tl').innerHTML = html;
})();
</script>
</body>
</html>
